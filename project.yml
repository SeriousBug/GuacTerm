name: GuacTerm

options:
  bundleIdPrefix: com.guacterm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  minimumXcodeGenVersion: "2.40.0"
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.99.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1

settings:
  base:
    # Swift 6 language mode, full strict concurrency.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # App Sandbox off (we fork/exec the user's shell). The hardened runtime
    # follows the signing identity instead, see Config/Signing.xcconfig.
    # No .entitlements file is referenced anywhere on purpose.
    ENABLE_APP_SANDBOX: NO
    # Housekeeping
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      GCC_OPTIMIZATION_LEVEL: "0"
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: "s"
      ONLY_ACTIVE_ARCH: NO
      SWIFT_ENABLE_TESTABILITY: NO

targets:
  GuacTerm:
    type: application
    platform: macOS
    sources:
      - path: Sources/GuacTerm
        name: GuacTerm
        type: group
        excludes:
          - "**/.DS_Store"
      # The vendored iTerm2 color schemes, generated by scripts/generate-themes.swift
      # and copied into GuacTerm.app/Contents/Resources/Themes.json at build time.
      - path: Resources/Themes.json
        name: Themes.json
        type: file
        buildPhase: resources
        optional: false
      # The app icon. scripts/make-icon.sh renders these PNGs from
      # Resources/logo.svg, which stays the source of the artwork.
      - path: Resources/Assets.xcassets
        name: Assets.xcassets
        type: file
        buildPhase: resources
        optional: false
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
    # Info.plist lives OUTSIDE the sources path so it is never copied twice.
    # It is (re)generated by xcodegen from the properties below, and is
    # deliberately NOT listed above: it must never enter a resources build phase.
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: GuacTerm
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIconFile: AppIcon
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Kaan C. Barmore-Genc. All rights reserved.
        NSPrincipalClass: NSApplication
        # Sparkle. The feed is the appcast.xml asset of the newest GitHub
        # release, so a check always reads the newest published version and the
        # file never has to be committed anywhere. SUPublicEDKey is the public
        # half of the release signing key: an appcast item or archive that is
        # not signed with it is refused. The private half is in the login
        # Keychain under the "guacterm" account (scripts/appcast.sh).
        #
        # SUEnableAutomaticChecks has to be present to skip Sparkle's "may I
        # check for you?" prompt on second launch; Settings can turn it off.
        SUFeedURL: https://github.com/SeriousBug/GuacTerm/releases/latest/download/appcast.xml
        SUPublicEDKey: I7w7y8pXITweUpMcTmtcV/AFQd21QmzWVH85f3EaNQg=
        SUEnableAutomaticChecks: true
        # Opening a .itermcolors file with GuacTerm imports it (see
        # AppDelegate.application(_:open:)). "Alternate" on purpose: iTerm2 stays
        # the default handler for its own format, and GuacTerm is just another
        # app in Open With.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.guacterm.itermcolors
            UTTypeDescription: iTerm2 Color Scheme
            UTTypeConformsTo:
              - public.data
              - public.property-list
            UTTypeTagSpecification:
              public.filename-extension:
                - itermcolors
        CFBundleDocumentTypes:
          - CFBundleTypeName: iTerm2 Color Scheme
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.guacterm.itermcolors
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_NAME: GuacTerm
        PRODUCT_BUNDLE_IDENTIFIER: com.guacterm.GuacTerm
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Resources/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        # Compiles Resources/Assets.xcassets into AppIcon.icns.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_APP_SANDBOX: NO
        # Signing defaults (ad-hoc, no team) come from Config/Signing.xcconfig so a
        # release build can override them from the CLI or by editing that file only.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    scheme:
      testTargets:
        - GuacTermTests
      gatherCoverageData: false

  GuacTermTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GuacTermTests
        name: GuacTermTests
        type: group
    dependencies:
      - target: GuacTerm
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guacterm.GuacTermTests
        GENERATE_INFOPLIST_FILE: YES
